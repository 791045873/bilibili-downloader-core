name: bilibili-downloader

services:
  vision-proxy:
    build:
      context: ../..
      dockerfile: packages/docker/Dockerfile.vision-proxy
    image: bilibili-downloader-vision-proxy:${VISION_PROXY_VERSION:?未设置 VISION_PROXY_VERSION：请先运行任意 pnpm docker:* 命令同步版本，或设置 VISION_PROXY_VERSION 环境变量}
    restart: unless-stopped
    environment:
      QWEN_VISION_PROXY_MAX_BODY_BYTES: ${QWEN_VISION_PROXY_MAX_BODY_BYTES:-16777216}
      QWEN_VISION_PROXY_MAX_CONCURRENCY: ${QWEN_VISION_PROXY_MAX_CONCURRENCY:-2}
      QWEN_VISION_PROXY_SOCKET_TIMEOUT: ${QWEN_VISION_PROXY_SOCKET_TIMEOUT:-120}
      LOG_DIR: /download/logs
      LOG_MAX_FILES: ${LOG_MAX_FILES:-7}
    volumes:
      - "${DOWNLOAD_HOST_PATH:-${HOME:-$USERPROFILE}/Downloads/bilibili_download}:/download"

  server:
    depends_on:
      vision-proxy:
        condition: service_healthy
    build:
      context: ../..
      dockerfile: packages/docker/Dockerfile.server
    image: bilibili-downloader-server:${SERVER_VERSION:?未设置 SERVER_VERSION：请先运行任意 pnpm docker:* 命令同步版本，或设置 SERVER_VERSION 环境变量}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      OUTPUT_DIR: /download
      LOG_DIR: /download/logs
      LOG_MAX_FILES: ${LOG_MAX_FILES:-7}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-10}
      MAX_CONCURRENT_LLM_CALLS: ${MAX_CONCURRENT_LLM_CALLS:-2}
      QWEN_VISION_PROXY_URL: ${QWEN_VISION_PROXY_URL:-http://vision-proxy:8765/v1/chat/completions}
      QWEN_VISION_PROXY_TIMEOUT_MS: ${QWEN_VISION_PROXY_TIMEOUT_MS:-}
      DATABASE_URL: ${DATABASE_URL:?未设置 DATABASE_URL：请配置云端 PostgreSQL 连接串（见 packages/docker/.env.example）}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_PUBLIC_URL_PREFIX: ${TENCENT_COS_PUBLIC_URL_PREFIX:-}
    volumes:
      - "${DOWNLOAD_HOST_PATH:-${HOME:-$USERPROFILE}/Downloads/bilibili_download}:/download"